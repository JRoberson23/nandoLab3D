{% extends "base.html" %}

{% block title %}Admin Login - NandoLab 3D{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        min-height: 70vh;
        display: flex;
        align-items: center;
    }
    .login-card {
        max-width: 400px;
        margin: 0 auto;
        border: none;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center login-container">
        <div class="col-md-6">
            <div class="card login-card">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <img src="/static/imagens/Logo.png" 
                             alt="NandoLab 3D" 
                             height="60" 
                             class="mb-3">
                        <h3 class="h4">
                            <i class="fas fa-lock text-primary me-2"></i>
                            Área Administrativa
                        </h3>
                        <p class="text-muted small">Acesso restrito ao proprietário</p>
                    </div>
                    
                    {% if error %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        {{ error }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endif %}
                    
                    <form method="POST" action="/admin/login">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Utilize o seu Login</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-user"></i>  
                                </span>
                                <input type="text" 
                                       class="form-control" 
                                       name="telefone" 
                                       placeholder="Login de Administrador" 
                                       required>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-key"></i>
                                </span>
                                <input type="password" 
                                       class="form-control" 
                                       name="senha" 
                                       id="senha"
                                       required>
                                <button class="btn btn-outline-secondary" 
                                        type="button" 
                                        id="toggleSenha">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="fas fa-sign-in-alt me-2"></i> Entrar no Painel
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Toggle para mostrar/ocultar senha
    document.getElementById('toggleSenha').addEventListener('click', function() {
        const senhaInput = document.getElementById('senha');
        const icon = this.querySelector('i');
        
        if (senhaInput.type === 'password') {
            senhaInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            senhaInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    });
</script>
{% endblock %}
